<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch Token Redirect</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #111;
      color: #ddd;
      padding: 0;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      background-color: #222;
      padding: 30px;
      border-radius: 8px;
      border: 1px solid #444;
      max-width: 500px;
      width: 100%;
    }

    h2 {
      color: #4CAF50; /* Green for success */
    }

    .container.error h2 {
      color: #ff5252; /* Red for errors */
    }

    #tokenBox {
      background-color: #333;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #666;
      margin-top: 20px;
      word-break: break-all;
      font-size: 14px;
      color: #fff;
      text-align: center;
      min-height: 40px; /* Ensuring it has enough space */
    }

    button {
      margin-top: 20px;
      padding: 6px 12px;
      font-size: 14px;
      background-color: #9146FF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #7a32db;
    }

    .spacer {
      margin-top: 10px;
    }

    .hint {
      margin-top: 14px;
      font-size: 13px;
      color: #999;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <div class="container" id="card">
    <h2 id="title">Twitch Token Retrieved</h2>
    <p id="text">Copy the token below and paste it into the plugin settings manually:</p>
    <div id="tokenBox">Loading...</div>
    <button id="copyBtn" onclick="copyToken()">Copy Token</button>
    <div class="hint" id="hint" hidden></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    // Токен приходить у #hash, помилки Twitch — або в ?query, або в #hash.
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const queryParams = new URLSearchParams(window.location.search);
    const get = key => hashParams.get(key) || queryParams.get(key);

    function copyToken() {
      const token = $('tokenBox').textContent;
      navigator.clipboard.writeText(token).then(() => {
        alert('Token copied to clipboard!');
      });
    }

    function showMessage(title, text, opts = {}) {
      $('title').textContent = title;
      $('text').textContent = text;
      $('tokenBox').hidden = true;
      $('copyBtn').hidden = true;
      $('card').classList.toggle('error', !!opts.error);
      if (opts.hint) {
        $('hint').textContent = opts.hint;
        $('hint').hidden = false;
      }
    }

    function init() {
      // Розширення Twitch Multi-View бере токен саме, тому показувати його не потрібно.
      // Воно ставить цю позначку до запуску скриптів сторінки й саме закриває вкладку.
      const ext = document.documentElement.dataset.mvAuth;
      if (ext === 'ok') {
        showMessage('Готово ✓', 'Авторизація успішна. Повертаємось у Twitch Multi-View…');
        setTimeout(() => window.close(), 1500); // запасний варіант, якщо вкладку не закрили
        return;
      }

      const error = get('error');
      if (error) {
        const description = get('error_description') || '';
        const hint = error === 'redirect_mismatch'
          ? 'Адреса цієї сторінки має бути точно додана в OAuth Redirect URLs застосунку на dev.twitch.tv.'
          : '';
        showMessage('Помилка авторизації', description ? `${error}: ${description}` : error, { error: true, hint });
        return;
      }

      // Звичайний режим для плагіна: показуємо токен і даємо його скопіювати.
      const token = hashParams.get('access_token');
      $('tokenBox').textContent = token || 'No token found in URL';
    }

    init();
  </script>
</body>
</html>
